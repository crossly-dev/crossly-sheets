name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Syntax check (Apps Script V8 sources)
        run: npm run check
      - name: Manifest is valid JSON with the expected scopes
        run: |
          node -e '
            const m = require("./appsscript.json");
            const want = ["spreadsheets.currentonly", "script.external_request", "script.container.ui"].map((s) => "https://www.googleapis.com/auth/" + s);
            if (m.runtimeVersion !== "V8") throw new Error("runtimeVersion must be V8");
            if (JSON.stringify([...m.oauthScopes].sort()) !== JSON.stringify([...want].sort())) throw new Error("unexpected oauthScopes");
            console.log("manifest ok");'
      - run: npm run lint
      - run: npm test
      - name: Bundle
        run: npm run bundle
      - uses: actions/upload-artifact@v7
        with:
          name: crossly-sheets-bundle
          path: dist/*.zip
          if-no-files-found: error
